name: Publish Package to npm

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Trusted publishing: npm exchanges the GitHub-issued OIDC token for a
# short-lived publish token, so no long-lived NPM_TOKEN secret is used.
# Requires a trusted publisher for this package on npmjs.com matching
# repository "cybershape/pi-my-compact-ui" and workflow "publish.yml".
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1. Node 24 ships npm 11,
          # while Node 22 only ships npm 10.x, so 24 is required here.
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Publish to npm
        # npm also generates the provenance attestation automatically for
        # trusted publishes; the flag is kept explicit on purpose.
        run: npm publish --access public --provenance
